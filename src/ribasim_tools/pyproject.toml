[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ribasim_tools"
description = "functions to work with Ribasim models"
readme = "README.md"
authors = [
    { name = "Daniel Tollenaar", email = "daniel@d2hydro.nl" },
    { name = "Bram Wijnants", email = "bram.wijnants@tauw.com" }
]
license = { text = "MIT" }

requires-python = ">=3.13"
dependencies = [
    "geopandas",
]
dynamic = ["version"]

[project.optional-dependencies]
tests = ["pytest"]

[tool.hatch.version]
path = "ribasim_tools/__init__.py"
