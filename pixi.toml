[workspace]
name = "Ribasim-Delwaq"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
python = "3.13.*"
imod = "*"
ipykernel = "*"
mypy = "*"
netcdf4 = "*"
pip = "*"
pydantic = ">=2"
pydantic-settings = "*"
pytest = "*"
ruff = "*"
xugrid = "*"

[pypi-dependencies]
ribasim = "==2026.1.0rc2"
ribasim_tools = { path = "src/ribasim_tools", editable = true }

[feature.spyder.dependencies]
spyder = "*"
spyder-kernels = "*"

[environments]
default = { solve-group = "default" }
spyder = { features = ["spyder"], solve-group = "default" }

[feature.spyder.tasks]
spyder = "spyder --workdir ."